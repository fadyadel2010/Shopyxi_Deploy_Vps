      <path d="M225 246 L294 246"/>
    </g>
    <circle cx="232" cy="291" r="9" fill="#FF8A00"/>
    <circle cx="281" cy="291" r="9" fill="#FF8A00"/>
    <path d="M83 421 C150 420 245 401 332 360 C354 350 372 337 388 320 C373 360 341 388 296 410 C220 447 143 461 83 454Z"
      fill="url(#orange)"/>
  </g>
</svg>