apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: controlled-qa-ahram-r1
  namespace: shopixy-app
  labels:
    shopixy.io/change: controlled-qa-20261111
    shopixy.io/tenant-id: cdbe20e0-f84a-4416-b20c-044e6bcf04d0
spec:
  secretName: controlled-qa-ahram-r1-tls
  issuerRef:
    kind: ClusterIssuer
    name: lets-encrypt-http01
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - ahram.shopyxi.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: controlled-qa-ahram-http-r1
  namespace: shopixy-app
  labels:
    shopixy.io/change: controlled-qa-20261111
    shopixy.io/tenant-id: cdbe20e0-f84a-4416-b20c-044e6bcf04d0
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`ahram.shopyxi.com`)
      priority: 10
      middlewares:
        - name: redirect-https
      services:
        - name: shopixy-storefront
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: controlled-qa-ahram-https-r1
  namespace: shopixy-app
  labels:
    shopixy.io/change: controlled-qa-20261111
    shopixy.io/tenant-id: cdbe20e0-f84a-4416-b20c-044e6bcf04d0
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ahram.shopyxi.com`) && (PathPrefix(`/api`) || PathPrefix(`/hubs`))
      priority: 300
      middlewares:
        - name: app82-api-no-store-r4
      services:
        - name: shopixy-api
          port: 8080
    - kind: Rule
      match: Host(`ahram.shopyxi.com`)
      priority: 100
      middlewares:
        - name: app82-frontend-security-r5
      services:
        - name: shopixy-storefront
          port: 8080
  tls:
    secretName: controlled-qa-ahram-r1-tls
