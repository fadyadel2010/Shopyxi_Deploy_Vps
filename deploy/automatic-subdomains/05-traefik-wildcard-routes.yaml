apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shopixy-tenant-wildcard-http-r1
  namespace: shopixy-app
  labels:
    app.kubernetes.io/part-of: shopixy-automatic-subdomains
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: HostRegexp(`^[a-z0-9]([a-z0-9-]{1,61})[a-z0-9]\.shopyxi\.com$`) && !HostRegexp(`^(about|account|accounts|admin|affiliate|api|app|app82-assurance-a|app82-assurance-b|assets|auth|beta|billing|blog|buy|cdn|certificate|commercehub|console|contact|dashboard|demo|dev|dmca|docs|documentation|domains|ecommerce|email|files|gdpr|help|images|imap|img|internal|intranet|legal|local|localhost|login|logout|mail|media|mx|news|notify|oauth|online|panel|payment|platform|pop|portal|pos|preview|privacy|private|qa|resend|rsend|saas|sandbox|secure|sell|send|shop|signin|signout|smtp|ssl|sso|staging|static|status|store|support|tenant|tenants|terms|test|tos|uat|upload|uploads|web|webmail|website|www)\.shopyxi\.com$`)
      # Lowest fallback: every existing exact HTTP route remains authoritative.
      priority: 1
      middlewares:
        - name: redirect-https
      services:
        - name: shopixy-storefront
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shopixy-tenant-wildcard-https-r1
  namespace: shopixy-app
  labels:
    app.kubernetes.io/part-of: shopixy-automatic-subdomains
spec:
  entryPoints:
    - websecure
  routes:
    # Preserve closed public admission and health/metrics restrictions on every
    # syntactically valid tenant host. Existing exact-host restrictions retain
    # still higher/equivalent explicit priorities.
    - kind: Rule
      match: HostRegexp(`^[a-z0-9]([a-z0-9-]{1,61})[a-z0-9]\.shopyxi\.com$`) && !HostRegexp(`^(about|account|accounts|admin|affiliate|api|app|app82-assurance-a|app82-assurance-b|assets|auth|beta|billing|blog|buy|cdn|certificate|commercehub|console|contact|dashboard|demo|dev|dmca|docs|documentation|domains|ecommerce|email|files|gdpr|help|images|imap|img|internal|intranet|legal|local|localhost|login|logout|mail|media|mx|news|notify|oauth|online|panel|payment|platform|pop|portal|pos|preview|privacy|private|qa|resend|rsend|saas|sandbox|secure|sell|send|shop|signin|signout|smtp|ssl|sso|staging|static|status|store|support|tenant|tenants|terms|test|tos|uat|upload|uploads|web|webmail|website|www)\.shopyxi\.com$`) && PathRegexp(`(?i)^/(health|healthz|metrics)(/|$)|(?i)^/api/(platform|auth|customers/auth|storefront/auth)/register(/|$)`)
      # Above wildcard API/frontend traffic, below existing exact-host private
      # admission routes (1000/1100).
      priority: 900
      middlewares:
        - name: app82-api-no-store-r4
        - name: app82-internal-only-r4
      services:
        - name: shopixy-api
          port: 8080
    - kind: Rule
      match: HostRegexp(`^[a-z0-9]([a-z0-9-]{1,61})[a-z0-9]\.shopyxi\.com$`) && !HostRegexp(`^(about|account|accounts|admin|affiliate|api|app|app82-assurance-a|app82-assurance-b|assets|auth|beta|billing|blog|buy|cdn|certificate|commercehub|console|contact|dashboard|demo|dev|dmca|docs|documentation|domains|ecommerce|email|files|gdpr|help|images|imap|img|internal|intranet|legal|local|localhost|login|logout|mail|media|mx|news|notify|oauth|online|panel|payment|platform|pop|portal|pos|preview|privacy|private|qa|resend|rsend|saas|sandbox|secure|sell|send|shop|signin|signout|smtp|ssl|sso|staging|static|status|store|support|tenant|tenants|terms|test|tos|uat|upload|uploads|web|webmail|website|www)\.shopyxi\.com$`) && (PathPrefix(`/api`) || PathPrefix(`/hubs`))
      # Existing exact-host API routes use priority 300.
      priority: 200
      middlewares:
        - name: app82-api-no-store-r4
      services:
        - name: shopixy-api
          port: 8080
    - kind: Rule
      match: HostRegexp(`^[a-z0-9]([a-z0-9-]{1,61})[a-z0-9]\.shopyxi\.com$`) && !HostRegexp(`^(about|account|accounts|admin|affiliate|api|app|app82-assurance-a|app82-assurance-b|assets|auth|beta|billing|blog|buy|cdn|certificate|commercehub|console|contact|dashboard|demo|dev|dmca|docs|documentation|domains|ecommerce|email|files|gdpr|help|images|imap|img|internal|intranet|legal|local|localhost|login|logout|mail|media|mx|news|notify|oauth|online|panel|payment|platform|pop|portal|pos|preview|privacy|private|qa|resend|rsend|saas|sandbox|secure|sell|send|shop|signin|signout|smtp|ssl|sso|staging|static|status|store|support|tenant|tenants|terms|test|tos|uat|upload|uploads|web|webmail|website|www)\.shopyxi\.com$`)
      # Existing exact frontend routes use explicit priorities or Traefik's
      # computed rule priority; this remains the final one-label fallback.
      priority: 1
      middlewares:
        - name: app82-frontend-security-r5
      services:
        - name: shopixy-storefront
          port: 8080
  tls:
    secretName: shopixy-wildcard-origin-r1-tls
