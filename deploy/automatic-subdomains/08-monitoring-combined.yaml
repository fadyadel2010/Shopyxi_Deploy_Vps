    \ to: 0\n      model:\n        refId: A\n        expr: increase(prometheus_target_scrapes_sample_out_of_order_total[10m])\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: gt\n            params:\n            - 0\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: shopixy-prom-series\n    title: Prometheus series budget exceeded\n    condition: B\n    for: 15m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: Prometheus series budget exceeded\n      description: Bounded single-VPS series budget. Inspect cardinality and exporters,\n        not existing database resource allocations.\n    labels:\n      severity: warning\n      stack: monitoring\n      phase: 4j\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: prometheus_tsdb_head_series\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: gt\n            params:\n            - 50000\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: shopixy-prom-objects\n    title: Prometheus TSDB retained blocks exceed plan\n    condition: B\n    for: 15m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: Prometheus TSDB retained blocks exceed plan\n      description: 1GB retention.size bounds blocks, not WAL/head or the shared filesystem.\n        Root reserve alerts cover total disk.\n    labels:\n      severity: warning\n      stack: monitoring\n      phase: 4j\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: prometheus_tsdb_storage_blocks_bytes\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: gt\n            params:\n            - 1200000000.0\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\ncontactPoints:\n- orgId: 1\n  name: Telegram\n  receivers:\n  - uid: telegram\n    type: telegram\n    settings:\n      bottoken: $TELEGRAM_BOT_TOKEN\n      chatid: $TELEGRAM_CHAT_ID\n      parse_mode: HTML\n      disable_web_page_preview: true\n      protect_content: true\n      message: '{{ template \"telegram.message\" . }}'\n    disableResolveMessage: false\npolicies:\n- orgId: 1\n  receiver: Telegram\n  group_by:\n  - alertname\n  - severity\n  - stack\n  group_wait: 30s\n  group_interval: 5m\n  repeat_interval: 4h\n  routes:\n  - receiver: Telegram\n    object_matchers:\n    - - synthetic\n      - '='\n      - phase4j\n    group_wait: 10s\n    group_interval: 30s\n    repeat_interval: 1h\ntemplates:\n- orgId: 1\n  name: telegram.message\n  template: \"{{ define \\\"telegram.message\\\" }}\\n{{ if eq .Status \\\"firing\\\" }}\\\
    U0001F6A8\\\n    \\ ALERT FIRING{{ else }}\\u2705 ALERT RESOLVED{{ end }}\\nShopixy production \\u2014\\\n    \\ single VPS\\nAlert: {{ .CommonLabels.alertname | html }}\\nSeverity: {{ .CommonLabels.severity\\\n    \\ | html }}\\nStack: {{ .CommonLabels.stack | html }}\\n{{ range .Alerts }}\\n{{\\\n    \\ .Annotations.summary | html }}\\n{{ .Annotations.description | html }}\\n{{ end\\\n    \\ }}\\n{{ end }}\"\n"
  automatic-subdomains.yaml: "apiVersion: 1\ngroups:\n  - orgId: 1\n    name: Shopixy automatic subdomains\n    folder: Shopixy alerts\n    interval: 1m\n    rules:\n      - uid: shopixy-wildcard-cert-ready\n        title: Shopixy wildcard origin certificate not ready\n        condition: B\n        for: 10m\n        noDataState: Alerting\n        execErrState: Alerting\n        isPaused: false\n        annotations:\n          summary: Shopixy wildcard origin certificate is not ready\n          description: cert-manager has not reported the wildcard origin certificate Ready for ten minutes.\n        labels:\n          severity: critical\n          stack: automatic-subdomains\n        data:\n          - refId: A\n            datasourceUid: prometheus\n            relativeTimeRange: { from: 900, to: 0 }\n            model:\n              refId: A\n              expr: 'min(certmanager_certificate_ready_status{name=\"shopixy-wildcard-origin-r1\",namespace=\"shopixy-app\",condition=\"True\"})'\n              instant: true\n              range: false\n              intervalMs: 60000\n              maxDataPoints: 1000\n          - refId: B\n            datasourceUid: __expr__\n            relativeTimeRange: { from: 900, to: 0 }\n            model:\n              refId: B\n              type: threshold\n              expression: A\n              conditions:\n                - type: query\n                  evaluator: { type: lt, params: [0.5] }\n                  operator: { type: and }\n                  reducer: { type: last, params: [] }\n                  query: { params: [B] }\n      - uid: shopixy-wildcard-cert-expiry\n        title: Shopixy wildcard origin certificate expires soon\n        condition: B\n        for: 30m\n        noDataState: Alerting\n        execErrState: Alerting\n        isPaused: false\n        annotations:\n          summary: Shopixy wildcard origin certificate expires within 14 days\n          description: Repair DNS-01 renewal before Cloudflare Full (strict) origin TLS fails.\n        labels:\n          severity: critical\n          stack: automatic-subdomains\n        data:\n          - refId: A\n            datasourceUid: prometheus\n            relativeTimeRange: { from: 900, to: 0 }\n            model:\n              refId: A\n              expr: 'min(certmanager_certificate_expiration_timestamp_seconds{name=\"shopixy-wildcard-origin-r1\",namespace=\"shopixy-app\"}) - time()'\n              instant: true\n              range: false\n              intervalMs: 60000\n              maxDataPoints: 1000\n          - refId: B\n            datasourceUid: __expr__\n            relativeTimeRange: { from: 900, to: 0 }\n            model:\n              refId: B\n              type: threshold\n              expression: A\n              conditions:\n                - type: query\n                  evaluator: { type: lt, params: [1209600] }\n                  operator: { type: and }\n                  reducer: { type: last, params: [] }\n                  query: { params: [B] }\n      - uid: shopixy-tenant-provisioning-failures\n        title: Shopixy tenant provisioning failures\n        condition: B\n        for: 10m\n        noDataState: OK\n        execErrState: Alerting\n        isPaused: false\n        annotations:\n          summary: Tenant provisioning failures are increasing\n          description: Inspect durable TenantProvisioningOperations and the tenant-provisioning-v1 queue.\n        labels:\n          severity: warning\n          stack: automatic-subdomains\n        data:\n          - refId: A\n            datasourceUid: prometheus\n            relativeTimeRange: { from: 900, to: 0 }\n            model:\n              refId: A\n              expr: 'sum(increase(tenant_provisioning_failures_total[15m])) or vector(0)'\n              instant: true\n              range: false\n              intervalMs: 60000\n              maxDataPoints: 1000\n          - refId: B\n            datasourceUid: __expr__\n            relativeTimeRange: { from: 900, to: 0 }\n            model:\n              refId: B\n \
    \             type: threshold\n              expression: A\n              conditions:\n                - type: query\n                  evaluator: { type: gt, params: [5] }\n                  operator: { type: and }\n                  reducer: { type: last, params: [] }\n                  query: { params: [B] }\n      - uid: shopixy-tenant-provisioning-backlog\n        title: Shopixy durable tenant provisioning backlog or overdue recovery\n        condition: B\n        for: 15m\n        noDataState: Alerting\n        execErrState: Alerting\n        isPaused: false\n        annotations:\n          summary: Durable tenant provisioning backlog is elevated or recovery is stuck\n          description: PostgreSQL has more than 50 pending operations, an overdue unleased operation remains unrecovered, or the recovery scan heartbeat is stale. RabbitMQ aggregate metrics are not mistaken for queue-specific telemetry.\n        labels:\n          severity: warning\n          stack: automatic-subdomains\n        data:\n          - refId: A\n            datasourceUid: prometheus\n            relativeTimeRange: { from: 900, to: 0 }\n            model:\n              refId: A\n              expr: '(max(tenant_provisioning_pending_operations) > bool 50) + (max(tenant_provisioning_recovery_overdue) > bool 0) + ((time() - max(tenant_provisioning_recovery_last_success_timestamp_seconds)) > bool 120)'\n              instant: true\n              range: false\n              intervalMs: 60000\n              maxDataPoints: 1000\n          - refId: B\n            datasourceUid: __expr__\n            relativeTimeRange: { from: 900, to: 0 }\n            model:\n              refId: B\n              type: threshold\n              expression: A\n              conditions:\n                - type: query\n                  evaluator: { type: gt, params: [0] }\n                  operator: { type: and }\n                  reducer: { type: last, params: [] }\n                  query: { params: [B] }\n"
