  app6e.yaml: "{\n  \"apiVersion\": 1,\n  \"groups\": [\n    {\n      \"orgId\": 1,\n      \"name\": \"APP6E Lifecycle\",\n      \"folder\": \"Shopixy alerts\",\n      \"interval\": \"1m\",\n      \"rules\": [\n        {\n          \"uid\": \"app6e-daily-lifecycle-stale\",\n          \"title\": \"APP6E daily backup or PKI lifecycle overdue\",\n          \"condition\": \"B\",\n          \"data\": [\n            {\n              \"refId\": \"A\",\n              \"relativeTimeRange\": {\n                \"from\": 600,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"prometheus\",\n              \"model\": {\n                \"refId\": \"A\",\n                \"expr\": \"max(time() - (kube_cronjob_status_last_successful_time{namespace=~\\\"shopixy-app|shopixy-cache|shopixy-messaging|shopixy-search\\\",cronjob=~\\\"shopixy-(dp-protected-backup|search-protected-backup|crl-renewal|client-leaf-sync)\\\"} or kube_cronjob_created{namespace=~\\\"shopixy-app|shopixy-cache|shopixy-messaging|shopixy-search\\\",cronjob=~\\\"shopixy-(dp-protected-backup|search-protected-backup|crl-renewal|client-leaf-sync)\\\"}))\",\n                \"instant\": true,\n                \"range\": false,\n                \"intervalMs\": 1000,\n                \"maxDataPoints\": 43200\n              }\n            },\n            {\n              \"refId\": \"B\",\n              \"relativeTimeRange\": {\n                \"from\": 0,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"__expr__\",\n              \"model\": {\n                \"refId\": \"B\",\n                \"type\": \"classic_conditions\",\n                \"conditions\": [\n                  {\n                    \"type\": \"query\",\n                    \"evaluator\": {\n                      \"type\": \"gt\",\n                      \"params\": [\n                        108000\n                      ]\n                    },\n                    \"operator\": {\n                      \"type\": \"and\"\n                    },\n                    \"query\": {\n                      \"params\": [\n                        \"A\"\n                      ]\n                    },\n                    \"reducer\": {\n                      \"type\": \"last\",\n                      \"params\": []\n                    }\n                  }\n                ]\n              }\n            }\n          ],\n          \"noDataState\": \"Alerting\",\n          \"execErrState\": \"Alerting\",\n          \"for\": \"5m\",\n          \"annotations\": {\n            \"summary\": \"APP6E daily backup or PKI lifecycle overdue\",\n            \"description\": \"APP6E production lifecycle. Investigate actual job logs; never mark missing telemetry healthy. Daily freshness allowance 30h; hourly guard2h. Initial manual acceptance is evidenced separately; created-time grace expires without scheduled success.\"\n          },\n          \"labels\": {\n            \"severity\": \"critical\",\n            \"phase\": \"APP6E\"\n          },\n          \"isPaused\": false\n        },\n        {\n          \"uid\": \"app6e-lifecycle-missing\",\n          \"title\": \"APP6E scheduled lifecycle object missing\",\n          \"condition\": \"B\",\n          \"data\": [\n            {\n              \"refId\": \"A\",\n              \"relativeTimeRange\": {\n                \"from\": 600,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"prometheus\",\n              \"model\": {\n                \"refId\": \"A\",\n                \"expr\": \"abs(count(kube_cronjob_created{namespace=~\\\"shopixy-app|shopixy-cache|shopixy-messaging|shopixy-search\\\",cronjob=~\\\"shopixy-(dp-protected-backup|search-protected-backup|crl-renewal|client-leaf-sync)\\\"}) - 7)\",\n                \"instant\": true,\n                \"range\": false,\n                \"intervalMs\": 1000,\n                \"maxDataPoints\": 43200\n              }\n            },\n            {\n              \"refId\": \"B\",\n              \"relativeTimeRange\": {\n         \
    \       \"from\": 0,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"__expr__\",\n              \"model\": {\n                \"refId\": \"B\",\n                \"type\": \"classic_conditions\",\n                \"conditions\": [\n                  {\n                    \"type\": \"query\",\n                    \"evaluator\": {\n                      \"type\": \"gt\",\n                      \"params\": [\n                        0\n                      ]\n                    },\n                    \"operator\": {\n                      \"type\": \"and\"\n                    },\n                    \"query\": {\n                      \"params\": [\n                        \"A\"\n                      ]\n                    },\n                    \"reducer\": {\n                      \"type\": \"last\",\n                      \"params\": []\n                    }\n                  }\n                ]\n              }\n            }\n          ],\n          \"noDataState\": \"Alerting\",\n          \"execErrState\": \"Alerting\",\n          \"for\": \"5m\",\n          \"annotations\": {\n            \"summary\": \"APP6E scheduled lifecycle object missing\",\n            \"description\": \"APP6E production lifecycle. Investigate actual job logs; never mark missing telemetry healthy. Daily freshness allowance 30h; hourly guard2h. Initial manual acceptance is evidenced separately; created-time grace expires without scheduled success.\"\n          },\n          \"labels\": {\n            \"severity\": \"critical\",\n            \"phase\": \"APP6E\"\n          },\n          \"isPaused\": false\n        },\n        {\n          \"uid\": \"app6e-pki-guard-overdue\",\n          \"title\": \"APP6E certificate CRL expiry guard overdue\",\n          \"condition\": \"B\",\n          \"data\": [\n            {\n              \"refId\": \"A\",\n              \"relativeTimeRange\": {\n                \"from\": 600,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"prometheus\",\n              \"model\": {\n                \"refId\": \"A\",\n                \"expr\": \"time() - max(kube_cronjob_status_last_successful_time{namespace=\\\"shopixy-app\\\",cronjob=\\\"shopixy-pki-lifecycle-guard\\\"} or kube_cronjob_created{namespace=\\\"shopixy-app\\\",cronjob=\\\"shopixy-pki-lifecycle-guard\\\"})\",\n                \"instant\": true,\n                \"range\": false,\n                \"intervalMs\": 1000,\n                \"maxDataPoints\": 43200\n              }\n            },\n            {\n              \"refId\": \"B\",\n              \"relativeTimeRange\": {\n                \"from\": 0,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"__expr__\",\n              \"model\": {\n                \"refId\": \"B\",\n                \"type\": \"classic_conditions\",\n                \"conditions\": [\n                  {\n                    \"type\": \"query\",\n                    \"evaluator\": {\n                      \"type\": \"gt\",\n                      \"params\": [\n                        7200\n                      ]\n                    },\n                    \"operator\": {\n                      \"type\": \"and\"\n                    },\n                    \"query\": {\n                      \"params\": [\n                        \"A\"\n                      ]\n                    },\n                    \"reducer\": {\n                      \"type\": \"last\",\n                      \"params\": []\n                    }\n                  }\n                ]\n              }\n            }\n          ],\n          \"noDataState\": \"Alerting\",\n          \"execErrState\": \"Alerting\",\n          \"for\": \"5m\",\n          \"annotations\": {\n            \"summary\": \"APP6E certificate CRL expiry guard overdue\",\n            \"description\": \"APP6E production lifecycle. Investigate actual job logs; never mark missing telemetry healthy. Daily freshness allowance 30h; hourly guard2h. Initial manual acceptance is evidenced\
    \ separately; created-time grace expires without scheduled success.\"\n          },\n          \"labels\": {\n            \"severity\": \"critical\",\n            \"phase\": \"APP6E\"\n          },\n          \"isPaused\": false\n        },\n        {\n          \"uid\": \"app6e-lifecycle-job-failed\",\n          \"title\": \"APP6E scheduled backup or PKI job failed\",\n          \"condition\": \"B\",\n          \"data\": [\n            {\n              \"refId\": \"A\",\n              \"relativeTimeRange\": {\n                \"from\": 600,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"prometheus\",\n              \"model\": {\n                \"refId\": \"A\",\n                \"expr\": \"max(kube_job_status_failed * on(namespace,job_name) group_left(owner_name) kube_job_owner{owner_name=~\\\"shopixy-(dp-protected-backup|search-protected-backup|crl-renewal|client-leaf-sync|pki-lifecycle-guard)\\\"})\",\n                \"instant\": true,\n                \"range\": false,\n                \"intervalMs\": 1000,\n                \"maxDataPoints\": 43200\n              }\n            },\n            {\n              \"refId\": \"B\",\n              \"relativeTimeRange\": {\n                \"from\": 0,\n                \"to\": 0\n              },\n              \"datasourceUid\": \"__expr__\",\n              \"model\": {\n                \"refId\": \"B\",\n                \"type\": \"classic_conditions\",\n                \"conditions\": [\n                  {\n                    \"type\": \"query\",\n                    \"evaluator\": {\n                      \"type\": \"gt\",\n                      \"params\": [\n                        0\n                      ]\n                    },\n                    \"operator\": {\n                      \"type\": \"and\"\n                    },\n                    \"query\": {\n                      \"params\": [\n                        \"A\"\n                      ]\n                    },\n                    \"reducer\": {\n                      \"type\": \"last\",\n                      \"params\": []\n                    }\n                  }\n                ]\n              }\n            }\n          ],\n          \"noDataState\": \"OK\",\n          \"execErrState\": \"Alerting\",\n          \"for\": \"5m\",\n          \"annotations\": {\n            \"summary\": \"APP6E scheduled backup or PKI job failed\",\n            \"description\": \"APP6E production lifecycle. Investigate actual job logs; never mark missing telemetry healthy. Daily freshness allowance 30h; hourly guard2h. Initial manual acceptance is evidenced separately; created-time grace expires without scheduled success.\"\n          },\n          \"labels\": {\n            \"severity\": \"critical\",\n            \"phase\": \"APP6E\"\n          },\n          \"isPaused\": false\n        }\n      ]\n    }\n  ]\n}"
  app82-r4.yaml: "apiVersion: 1\ngroups:\n- orgId: 1\n  name: APP82 production\n  folder: Shopixy alerts\n  interval: 1m\n  rules:\n  - uid: app82-api-scrape\n    title: APP82 API metrics unavailable\n    condition: B\n    for: 2m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: APP82 API metrics unavailable\n      description: 'APP82 acceptance: inspect exact deployment, private telemetry,\n        certificate and edge-r4 reconciler; preserve financial records and singleton\n        API.'\n    labels:\n      severity: critical\n      stack: app82\n      phase: app82\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: up{job=\"shopixy-api\"}\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: lt\n            params:\n            - 0.5\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: app82-api-ready\n    title: APP82 Backend replica not Ready\n    condition: B\n    for: 2m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: APP82 Backend replica not Ready\n      description: 'APP82 acceptance: inspect exact deployment, private telemetry,\n        certificate and edge-r4 reconciler; preserve financial records and singleton\n        API.'\n    labels:\n      severity: critical\n      stack: app82\n      phase: app82\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: kube_deployment_status_replicas_available{namespace=\"shopixy-app\",deployment=\"shopixy-api\"}\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: lt\n            params:\n            - 0.5\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: app82-api-singleton\n    title: APP82 Backend singleton invariant violated\n    condition: B\n    for: 1m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: APP82 Backend singleton invariant violated\n      description: 'APP82 acceptance: inspect exact deployment, private telemetry,\n        certificate and edge-r4 reconciler; preserve financial records and singleton\n        API.'\n    labels:\n      severity: critical\n      stack: app82\n      phase: app82\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: kube_deployment_spec_replicas{namespace=\"shopixy-app\",deployment=\"shopixy-api\"}\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: gt\n            params:\n            - 1\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n    \
    \        params:\n            - B\n  - uid: app82-traefik-scrape\n    title: APP82 Traefik metrics unavailable\n    condition: B\n    for: 2m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: APP82 Traefik metrics unavailable\n      description: 'APP82 acceptance: inspect exact deployment, private telemetry,\n        certificate and edge-r4 reconciler; preserve financial records and singleton\n        API.'\n    labels:\n      severity: critical\n      stack: app82\n      phase: app82\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: up{job=\"traefik-app82\"}\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: lt\n            params:\n            - 0.5\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: app82-cert-scrape\n    title: APP82 cert-manager metrics unavailable\n    condition: B\n    for: 2m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: APP82 cert-manager metrics unavailable\n      description: 'APP82 acceptance: inspect exact deployment, private telemetry,\n        certificate and edge-r4 reconciler; preserve financial records and singleton\n        API.'\n    labels:\n      severity: critical\n      stack: app82\n      phase: app82\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: up{job=\"cert-manager-app82\"}\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: lt\n            params:\n            - 0.5\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: app82-cert-expiry\n    title: APP82 public API/frontend certificate expires within 21 days\n    condition: B\n    for: 5m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: APP82 public API/frontend certificate expires within 21 days\n      description: 'APP82 acceptance: inspect exact deployment, private telemetry,\n        certificate and edge-r4 reconciler; preserve financial records and singleton\n        API.'\n    labels:\n      severity: warning\n      stack: app82\n      phase: app82\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: certmanager_certificate_expiration_timestamp_seconds{namespace=\"shopixy-app\",name=~\"shopixy-api-tls|shopixy-frontends-app82-r5\"}\n          - time()\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: lt\n            params:\n            - 1814400\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n   \
    \         - B\n  - uid: app82-cert-ready\n    title: APP82 public API/frontend certificate not Ready\n    condition: B\n    for: 5m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: APP82 public API/frontend certificate not Ready\n      description: 'APP82 acceptance: inspect exact deployment, private telemetry,\n        certificate and edge-r4 reconciler; preserve financial records and singleton\n        API.'\n    labels:\n      severity: critical\n      stack: app82\n      phase: app82\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: certmanager_certificate_ready_status{namespace=\"shopixy-app\",name=~\"shopixy-api-tls|shopixy-frontends-app82-r5\",condition=\"True\"}\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: lt\n            params:\n            - 0.5\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n"
  production.yaml: "apiVersion: 1\ngroups:\n- orgId: 1\n  name: Production\n  folder: Shopixy alerts\n  interval: 1m\n  rules:\n  - uid: shopixy-target-down\n    title: Monitoring target unavailable\n    condition: B\n    for: 3m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: Monitoring target unavailable\n      description: Inspect the corresponding Shopixy dashboard. Do not restart or\n        retune completed database stacks automatically.\n    labels:\n      severity: critical\n      stack: monitoring\n      phase: 4j\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: up\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: lt\n            params:\n            - 0.5\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: shopixy-target-count\n    title: Expected scrape target missing\n    condition: B\n    for: 5m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: Expected scrape target missing\n      description: Inspect the corresponding Shopixy dashboard. Do not restart or\n        retune completed database stacks automatically.\n    labels:\n      severity: critical\n      stack: monitoring\n      phase: 4j\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: count(up)\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: lt\n            params:\n            - 20\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: shopixy-node-cpu\n    title: Node sustained CPU saturation\n    condition: B\n    for: 15m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: Node sustained CPU saturation\n      description: Inspect the corresponding Shopixy dashboard. Do not restart or\n        retune completed database stacks automatically.\n    labels:\n      severity: warning\n      stack: node\n      phase: 4j\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: gt\n            params:\n            - 90\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: shopixy-node-memory\n    title: Node memory reserve low\n    condition: B\n    for: 10m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: Node memory reserve low\n      description: Inspect\
    \ the corresponding Shopixy dashboard. Do not restart or\n        retune completed database stacks automatically.\n    labels:\n      severity: warning\n      stack: node\n      phase: 4j\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: min(node_memory_MemAvailable_bytes) / 1024^3\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: lt\n            params:\n            - 6\n          operator:\n            type: and\n          reducer:\n            type: last\n            params: []\n          query:\n            params:\n            - B\n  - uid: shopixy-node-memory-critical\n    title: Node memory reserve critical\n    condition: B\n    for: 5m\n    noDataState: Alerting\n    execErrState: Alerting\n    isPaused: false\n    annotations:\n      summary: Node memory reserve critical\n      description: Inspect the corresponding Shopixy dashboard. Do not restart or\n        retune completed database stacks automatically.\n    labels:\n      severity: critical\n      stack: node\n      phase: 4j\n    data:\n    - refId: A\n      datasourceUid: prometheus\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: A\n        expr: min(node_memory_MemAvailable_bytes) / 1024^3\n        instant: true\n        range: false\n        intervalMs: 60000\n        maxDataPoints: 1000\n    - refId: B\n      datasourceUid: __expr__\n      relativeTimeRange:\n        from: 900\n        to: 0\n      model:\n        refId: B\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n    