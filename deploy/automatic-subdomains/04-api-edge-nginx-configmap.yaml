apiVersion: v1
kind: ConfigMap
metadata:
  name: shopixy-api-clientip-edge-wildcard-r1
  namespace: shopixy-app
  labels:
    app.kubernetes.io/part-of: shopixy-automatic-subdomains
immutable: true
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
        access_log off;
        server_tokens off;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        map $uri $subdomain_limit_key {
            default "";
            ~*^/api/platform/subdomain/check/?$ $binary_remote_addr;
        }
        map $uri $email_limit_key {
            default "";
            ~*^/api/platform/email/check/?$ $binary_remote_addr;
        }
        limit_req_zone $subdomain_limit_key zone=subdomain_lookup:1m rate=30r/m;
        limit_req_zone $email_limit_key zone=email_lookup:1m rate=20r/m;

        map $host $host_allowed {
            default 0;
            shopyxi.com 1;
            "~^[a-z0-9](?:[a-z0-9-]{1,61})[a-z0-9]\.shopyxi\.com$" 1;
            shopixy-api 1;
            shopixy-api.shopixy-app 1;
            shopixy-api.shopixy-app.svc 1;
            shopixy-api.shopixy-app.svc.cluster.local 1;
            localhost 1;
            127.0.0.1 1;
        }
        map $http_upgrade $connection_upgrade { default upgrade; '' close; }
        map $http_x_forwarded_proto $trusted_proto { default $scheme; https https; http http; }

        # Accepted Traefik pod authority plus Cloudflare's published proxy ranges.
        set_real_ip_from 10.42.0.239/32;
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        upstream canonical_api { server 127.0.0.1:8080; keepalive 8; }
        server {
            listen 127.0.0.1:18081;
            location / { return 204; }
        }
        server {
            listen 18080;
            limit_req zone=subdomain_lookup burst=29 nodelay;
            limit_req zone=email_lookup burst=19 nodelay;
            limit_req_status 429;
            error_page 429 = @lookup_rate_limited;
            location @lookup_rate_limited {
                default_type application/json;
                add_header Retry-After 60 always;
                add_header Cache-Control "private, no-store, max-age=0" always;
                add_header X-Shopixy-Response-Source "lookup-rate-guard" always;
                return 429 '{"error":"RATE_LIMITED","message":"Too many lookup attempts. Please try again later."}';
            }
            if ($host_allowed = 0) { return 421; }
            location / {
                client_max_body_size 64m;
                proxy_pass http://canonical_api;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Proto $trusted_proto;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header CF-Connecting-IP "";
                proxy_set_header Forwarded "";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_cache off;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_connect_timeout 5s;
                proxy_read_timeout 60s;
                add_header Cache-Control "private, no-store, max-age=0" always;
                add_header Vary Host always;
            }
        }
    }
