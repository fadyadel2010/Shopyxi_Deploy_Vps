worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1k;
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/xml text/plain application/json;
  map $uri $marketing_file {
    default "";
    "/robots.txt" "/robots.txt";
    "/sitemap.xml" "/sitemap.xml";
    "/en/" "/en/index.html";
    "/en/platform" "/en/platform/index.html";
    "/en/platform/" "/en/platform/index.html";
    "/en/products/pos" "/en/products/pos/index.html";
    "/en/products/pos/" "/en/products/pos/index.html";
    "/en/products/storefront" "/en/products/storefront/index.html";
    "/en/products/storefront/" "/en/products/storefront/index.html";
    "/en/products/affiliate" "/en/products/affiliate/index.html";
    "/en/products/affiliate/" "/en/products/affiliate/index.html";
    "/en/products/commercehub" "/en/products/commercehub/index.html";
    "/en/products/commercehub/" "/en/products/commercehub/index.html";
    "/ar/" "/ar/index.html";
    "/ar/platform" "/ar/platform/index.html";
    "/ar/platform/" "/ar/platform/index.html";
    "/ar/products/pos" "/ar/products/pos/index.html";
    "/ar/products/pos/" "/ar/products/pos/index.html";
    "/ar/products/storefront" "/ar/products/storefront/index.html";
    "/ar/products/storefront/" "/ar/products/storefront/index.html";
    "/ar/products/affiliate" "/ar/products/affiliate/index.html";
    "/ar/products/affiliate/" "/ar/products/affiliate/index.html";
    "/ar/products/commercehub" "/ar/products/commercehub/index.html";
    "/ar/products/commercehub/" "/ar/products/commercehub/index.html";
  }
  map $uri $cache_control {
    default "public, no-cache, max-age=0, must-revalidate, no-transform";
    "/" "no-store, no-cache, max-age=0, must-revalidate, no-transform";
    "~^/assets/(marketing|navigation)-[0-9a-f]{12}\.(css|js)$" "public, max-age=31536000, immutable";
    ~^/assets/ "public, max-age=3600, must-revalidate";
  }
  map $uri $root_robots {
    default "";
    "/" "noindex, follow";
  }
  server {
    listen 8080;
    server_name shopyxi.com;
    absolute_redirect off;
    root /site;
    if ($host != shopyxi.com) { return 444; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $root_robots always;
    location = / { return 302 /ar/; }
    location /assets/ { try_files $uri =404; }
    location / { if ($marketing_file = "") { return 404; } try_files $marketing_file =404; }
  }
  server {
    listen 8081;
    server_name _;
    access_log off;
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
  }
}
